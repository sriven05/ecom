<!DOCTYPE html>
<html>
<head>
<title>E-CRM Touchpoints</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>E-CRM Customer Touchpoints</h1>
<p>Awareness - Customer sees an advertisement.</p>
<p>Consideration - Customer compares products.</p>
<p>Purchase - Customer places an order.</p>
<p>Support - Customer asks for help.</p>
<p>Retention - Store sends follow-up offers.</p>
<input id="customer" placeholder="Customer name">
<select id="stage"><option>Awareness</option><option>Consideration</option>
<option>Purchase</option><option>Support</option><option>Retention</option></select>
<input id="notes" placeholder="Interaction notes">
<button onclick="addTouchpoint()">Add Interaction</button>
<button onclick="clearEntries()">Clear List</button>
<ol id="log"></ol>
<script src="script.js"></script>
</body>
</html>
